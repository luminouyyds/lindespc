    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #c8102e;
            --blue: #00539b;
            --gray: #f5f7fa;
            --dark: #1e2a36;
            --text: #4a5568;
            --linde-blue: #002855;
            --shadow-sm: 0 8px 20px rgba(0,0,0,0.05), 0 2px 6px rgba(0,0,0,0.03);
            --shadow-md: 0 12px 28px rgba(0,0,0,0.08);
        }

        body {
            color: var(--dark);
            background: #fff;
            padding-top: 90px;
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Roboto, sans-serif;
            line-height: 1.5;
        }

/* 导航栏 - 修复垂直居中问题 */
.navbar {
    position: fixed;
    top: 0;
    width: 100%;
    background: var(--linde-blue);
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    z-index: 999;
    padding: 12px 0;
}
.nav-wrap {
    max-width: 100%;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 40px;
    flex-wrap: wrap;
}
.logo-box {
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 18px;
    font-weight: bold;
    color: #fff;
    line-height: 1.2;
}
.logo-icon {
    display: flex;
    gap: 12px;
    align-items: center;
}
.logo-icon img {
    height: 45px;
    width: auto;
    object-fit: contain;
    display: block;
}
.nav-links {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    align-items: center;
}
.nav-links a {
    text-decoration: none;
    color: #fff;
    font-weight: 500;
    transition: opacity 0.3s;
    font-size: 16px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
}
.nav-links a:hover {
    opacity: 0.8;
}
/* 高亮新项目签约按钮 */
.nav-links a:last-child {
    background: var(--red);
    padding: 6px 14px;
    border-radius: 40px;
    transition: all 0.3s;
}
.nav-links a:last-child:hover {
    background: #a00d26;
    opacity: 1;
}

/* 响应式适配 */
@media (max-width: 768px) {
    .navbar { padding: 10px 0; }
    .nav-wrap { padding: 0 20px; gap: 12px; justify-content: center; }
    .logo-icon img { height: 32px; }
    .logo-box { font-size: 14px; }
    .nav-links { gap: 12px; justify-content: center; margin-top: 0; }
    .nav-links a:last-child { padding: 4px 12px; font-size: 14px; }
}
        /* 主容器宽度进一步增大，让下方内容更舒展 */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        .title {
            text-align: center;
            font-size: 36px;
            color: var(--blue);
            margin-bottom: 48px;
            position: relative;
            font-weight: 600;
        }
        .title::after {
            content: '';
            width: 90px;
            height: 4px;
            background: var(--red);
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        /* 顶部两位总经理单独一排，保持原始宽度比例 */
        .top-leaders {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 32px;
            margin-bottom: 56px;
        }
        .top-leaders .team-card {
            flex: 1;
            min-width: 280px;
            max-width: 380px;
        }

        /* 下方部门经理网格：一排5个，但每个卡片更宽，通过增大容器宽度和卡片内边距实现 */
        .executive-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 40px 32px;
            margin-bottom: 30px;
        }

        /* 卡片样式：图片高度略微增加，整体更宽更舒展 */
        .team-card {
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
            border: 1px solid rgba(0,83,155,0.1);
        }
        .team-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-md);
        }
        .team-card-img {
            width: 100%;
            height: 300px;          /* 照片高度增加，更大气 */
            object-fit: cover;
            background-color: #eef2f8;
            transition: 0.2s;
        }
        .team-card h4 {
            margin-top: 20px;
            font-size: 1.35rem;
            color: var(--linde-blue);
            font-weight: 650;
            letter-spacing: 1px;
        }
        .team-card .position {
            font-size: 0.9rem;
            color: var(--red);
            font-weight: 500;
            margin-top: 8px;
            letter-spacing: 1px;
            padding: 0 10px;
        }
        .team-card .brief {
            padding: 14px 18px 22px;
            font-size: 0.88rem;
            color: var(--text);
            line-height: 1.5;
            border-top: 1px solid #edf2f7;
            margin-top: 14px;
        }

        /* 部门合影网格：每行四个，格子更大更舒展 */
        .dept-group {
            margin: 80px 0;
        }
        .dept-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 40px;
            justify-items: center;
        }
        .dept-item {
            width: 100%;
            max-width: 100%;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s;
            cursor: pointer;
            background: #fff;
        }
        .dept-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            background-color: #eef2f8;
        }
        .dept-item p {
            text-align: center;
            padding: 18px 0;
            color: var(--blue);
            font-weight: 600;
            font-size: 1.1rem;
            margin: 0;
            background: #fff;
            border-top: 1px solid #f0f2f5;
        }
        .dept-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }

        /* 员工风采画廊，格子加大 */
        .gallery-title {
            margin-top: 80px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 36px;
            margin-bottom: 20px;
        }
        .g-item {
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s;
            cursor: pointer;
            background: #fff;
        }
        .g-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }
        .g-item img {
            width: 100%;
            height: 270px;
            object-fit: cover;
            display: block;
        }

        footer {
            background: var(--dark);
            color: #fff;
            text-align: center;
            padding: 28px 20px;
            font-size: 14px;
            margin-top: 60px;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .modal-img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 16px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.2);
        }
        .modal-desc {
            color: #fff;
            font-size: 1rem;
            margin-top: 20px;
            text-align: center;
            background: rgba(0,0,0,0.6);
            padding: 10px 24px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
        }
        .close-btn {
            position: absolute;
            top: -48px;
            right: 0;
            color: #fff;
            font-size: 38px;
            font-weight: 300;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(0,0,0,0.5);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-btn:hover {
            background: var(--red);
            transform: scale(1.05);
        }

        /* 响应式：平板每行显示3个，手机显示1个，同时保证卡片不过度拥挤 */
        @media (max-width: 1300px) {
            .executive-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 30px;
            }
            .top-leaders .team-card {
                min-width: 260px;
                max-width: 340px;
            }
            .dept-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 30px;
            }
            .team-card-img {
                height: 280px;
            }
        }

        @media (max-width: 768px) {
            body { padding-top: 80px; }
            .container { padding: 40px 20px; max-width: 100%; }
            .logo-icon img { height: 32px; }
            .nav-wrap { padding: 0 20px; flex-wrap: wrap; gap: 10px; }
            .nav-links { gap: 16px; flex-wrap: wrap; justify-content: center; }
            .logo-box { font-size: 14px; }
            .title { font-size: 28px; }
            .team-card-img { height: 260px; }
            .g-item img { height: 230px; }
            .top-leaders {
                flex-direction: column;
                align-items: center;
            }
            .top-leaders .team-card {
                max-width: 360px;
                width: 100%;
            }
            .executive-grid {
                grid-template-columns: 1fr;
                gap: 28px;
            }
            .dept-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .dept-item img {
                height: 210px;
            }
        }
    </style>
</head>

        { name: "电工班A", img: "电气1.jpg", desc: "电工班A合影：技术精湛，保障全厂电气设备稳定运行，快速响应电力故障，为安全生产提供坚实电力后盾。", defaultPic: "https://picsum.photos/id/11/600/400" },
        { name: "电工班B", img: "c02b.jpg", desc: "电工班B合影：一丝不苟，专注电气系统预防性维护，提升电气安全水平，助力公司节能降耗与平稳供电。", defaultPic: "https://picsum.photos/id/14/600/400" },
        { name: "电工班C", img: "电气2.jpg", desc: "电工班C合影：严谨务实，高效协作，承担厂区关键电气检修任务，强化应急预案与值班响应，为生产保驾护航。", defaultPic: "https://picsum.photos/id/15/600/400" }
    ];

    // 通用函数：创建个人卡片（下方经理卡片照片更高，整体更宽）
    function createTeamCard(member, fullDesc, isTopExecutive = false) {
        const card = document.createElement('div');
        card.className = 'team-card';
        const descForModal = fullDesc || `${member.name} · ${member.position}：${member.brief}`;
        card.setAttribute('data-img', member.img);
        card.setAttribute('data-desc', descForModal);
        // 对于下方经理，图片高度已经在CSS中统一设为300px，更大气
        card.innerHTML = `
            <img class="team-card-img" src="${member.img}" alt="${member.alt}" loading="lazy" onerror="this.src='https://picsum.photos/id/1/600/600'">
            <h4>${member.name}</h4>
            <div class="position">${member.position}</div>
            <div class="brief">${member.brief.length > 80 ? member.brief.substring(0, 80) + '…' : member.brief}</div>
        `;
        card.addEventListener('click', (e) => {
            e.stopPropagation();
            openModal(member.img, descForModal);
        });
        return card;
    }

    // 渲染顶部两位总经理（保持原始比例，不额外加宽）
    function renderTopLeaders() {
        const container = document.getElementById('topLeadersContainer');
        if (!container) return;
        container.innerHTML = '';
        topExecutives.forEach(exec => {
            const fullDesc = `${exec.name} · ${exec.position}：${exec.brief}`;
            const card = createTeamCard(exec, fullDesc, true);
            container.appendChild(card);
        });
    }

    // 渲染下方部门经理（卡片全面加宽，照片更大，两排每排5个）
    function renderOtherLeaders() {
        const container = document.getElementById('otherLeadersContainer');
        if (!container) return;
        container.innerHTML = '';
        const gridWrapper = document.createElement('div');
        gridWrapper.className = 'executive-grid';
        otherManagers.forEach(manager => {
            const fullDesc = `${manager.name} · ${manager.position}：${manager.brief}`;
            const card = createTeamCard(manager, fullDesc, false);
            gridWrapper.appendChild(card);
        });
        container.appendChild(gridWrapper);
    }

    // 部门合影渲染（格子更大）
    function renderDeptGallery() {
        const galleryContainer = document.getElementById('deptGallery');
        if (!galleryContainer) return;
        galleryContainer.innerHTML = '';
        deptPhotos.forEach(dept => {
            const deptDiv = document.createElement('div');
            deptDiv.className = 'dept-item';
            const imgSrc = dept.img && dept.img !== '' ? dept.img : dept.defaultPic;
            deptDiv.setAttribute('data-img', imgSrc);
            deptDiv.setAttribute('data-desc', dept.desc);
            deptDiv.innerHTML = `
                <img src="${imgSrc}" alt="${dept.name}" loading="lazy" onerror="this.src='${dept.defaultPic}'">
                <p>${dept.name}</p>
            `;
            deptDiv.addEventListener('click', (e) => {
                e.stopPropagation();
                openModal(imgSrc, dept.desc);
            });
            galleryContainer.appendChild(deptDiv);
        });
    }

    // 员工风采画廊（格子加大）
    function renderStaffGallery() {
        const galleryContainer = document.getElementById('staffGallery');
        if (!galleryContainer) return;
        galleryContainer.innerHTML = '';
        staffImages.forEach(item => {
            const galItem = document.createElement('div');
            galItem.className = 'g-item';
            galItem.setAttribute('data-img', item.img);
            galItem.setAttribute('data-desc', item.desc);
            galItem.innerHTML = `<img src="${item.img}" alt="员工风采" loading="lazy" onerror="this.src='https://picsum.photos/id/1/600/400'">`;
            galItem.addEventListener('click', (e) => {
                e.stopPropagation();
                openModal(item.img, item.desc);
            });
            galleryContainer.appendChild(galItem);
        });
    }

    // 模态框逻辑
    const modal = document.getElementById('imgModal');
    const modalImg = document.getElementById('modalImg');
    const modalDesc = document.getElementById('modalDesc');
    const closeBtn = document.getElementById('closeBtn');

    function openModal(imgSrc, descText) {
        if (!modal || !modalImg) return;
        modalImg.src = imgSrc;
        modalImg.alt = descText || '团队风采照片';
        modalDesc.textContent = descText || '上海石化林德气体珍贵影像';
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        if (modal) {
            modal.style.display = 'none';
            document.body.style.overflow = '';
            setTimeout(() => {
                if (modalImg) modalImg.src = '';
            }, 200);
        }
    }

    if (closeBtn) closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeModal(); });
    if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal && modal.style.display === 'flex') closeModal(); });

    window.addEventListener('DOMContentLoaded', () => {
        renderTopLeaders();      // 两位老总单独一排，卡片比例与原始完全相同
        renderOtherLeaders();    // 下方共10人，两排各5人，卡片及照片全面加宽，更舒展
        renderDeptGallery();     // 部门合影格子变大
        renderStaffGallery();    // 员工风采格子变大
    });
</script>
