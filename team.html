    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #c8102e;
            --blue: #00539b;
            --gray: #f5f7fa;
            --dark: #1e2a36;
            --text: #4a5568;
            --linde-blue: #002855;
            --shadow-sm: 0 8px 20px rgba(0,0,0,0.05), 0 2px 6px rgba(0,0,0,0.03);
            --shadow-md: 0 12px 28px rgba(0,0,0,0.08);
        }

        body {
            color: var(--dark);
            background: #fff;
            padding-top: 90px;
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Roboto, sans-serif;
            line-height: 1.5;
        }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--linde-blue);
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            z-index: 999;
            padding: 14px 0;
        }
        .nav-wrap {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
        }
        .logo-box {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }
        .logo-icon {
            display: flex;
            gap: 12px;
        }
        .logo-icon img {
            height: 45px;
            width: auto;
            object-fit: contain;
        }
        .nav-links {
            display: flex;
            gap: 28px;
        }
        .nav-links a {
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            transition: opacity 0.3s;
            font-size: 16px;
        }
        .nav-links a:hover {
            opacity: 0.8;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        .title {
            text-align: center;
            font-size: 36px;
            color: var(--blue);
            margin-bottom: 48px;
            position: relative;
            font-weight: 600;
        }
        .title::after {
            content: '';
            width: 90px;
            height: 4px;
            background: var(--red);
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        /* 核心团队布局 */
        /* 顶部总经理并排区域 */
        .top-leaders {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 32px;
            margin-bottom: 56px;
        }
        .top-leaders .team-card {
            flex: 1;
            min-width: 280px;
            max-width: 380px;
        }

        /* 其他部门经理网格：一排4个 (自动响应) */
        .executive-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 32px;
            margin-bottom: 20px;
        }

        .team-card {
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
            border: 1px solid rgba(0,83,155,0.1);
        }
        .team-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-md);
        }
        .team-card-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background-color: #eef2f8;
            transition: 0.2s;
        }
        .team-card h4 {
            margin-top: 18px;
            font-size: 1.3rem;
            color: var(--linde-blue);
            font-weight: 650;
            letter-spacing: 1px;
        }
        .team-card .position {
            font-size: 0.9rem;
            color: var(--red);
            font-weight: 500;
            margin-top: 6px;
            letter-spacing: 1px;
        }
        .team-card .brief {
            padding: 12px 16px 20px;
            font-size: 0.85rem;
            color: var(--text);
            line-height: 1.45;
            border-top: 1px solid #edf2f7;
            margin-top: 12px;
        }

        /* 部门合影样式 - 修改为每行四个网格 */
        .dept-group {
            margin: 70px 0;
        }
        .dept-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 28px;
            justify-items: center;
        }
        .dept-item {
            width: 100%;
            max-width: 100%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s;
            cursor: pointer;
            background: #fff;
        }
        .dept-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            background-color: #eef2f8;
        }
        .dept-item p {
            text-align: center;
            padding: 14px 0;
            color: var(--blue);
            font-weight: 600;
            font-size: 1rem;
            margin: 0;
            background: #fff;
            border-top: 1px solid #f0f2f5;
        }
        .dept-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }

        /* 员工风采 / 活动 画廊样式 */
        .gallery-title {
            margin-top: 70px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
            margin-bottom: 20px;
        }
        .g-item {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s;
            cursor: pointer;
            background: #fff;
        }
        .g-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }
        .g-item img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        footer {
            background: var(--dark);
            color: #fff;
            text-align: center;
            padding: 28px 20px;
            font-size: 14px;
            margin-top: 60px;
        }

        /* 模态框 (图片放大) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .modal-img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 16px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.2);
        }
        .modal-desc {
            color: #fff;
            font-size: 1rem;
            margin-top: 20px;
            text-align: center;
            background: rgba(0,0,0,0.6);
            padding: 10px 24px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
        }
        .close-btn {
            position: absolute;
            top: -48px;
            right: 0;
            color: #fff;
            font-size: 38px;
            font-weight: 300;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(0,0,0,0.5);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-btn:hover {
            background: var(--red);
            transform: scale(1.05);
        }

        /* 响应式：平板及手机屏幕下每行显示2个或1个 */
        @media (max-width: 1024px) {
            .executive-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 28px;
            }
            .dept-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 24px;
            }
        }

        @media (max-width: 768px) {
            body { padding-top: 80px; }
            .container { padding: 40px 20px; }
            .logo-icon img { height: 32px; }
            .nav-wrap { padding: 0 20px; flex-wrap: wrap; gap: 10px; }
            .nav-links { gap: 16px; flex-wrap: wrap; justify-content: center; }
            .logo-box { font-size: 14px; }
            .title { font-size: 28px; }

            .g-item img { height: 200px; }
            .modal-desc { font-size: 14px; }
            .top-leaders .team-card {
                min-width: 260px;
            }
            .executive-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .dept-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .dept-item img {
                height: 180px;
            }
        }
    </style>
</head>

    // 通用函数：创建团队卡片DOM
    function createTeamCard(member, fullDesc) {
        const card = document.createElement('div');
        card.className = 'team-card';
        const descForModal = fullDesc || `${member.name} · ${member.position}：${member.brief}`;
        card.setAttribute('data-img', member.img);
        card.setAttribute('data-desc', descForModal);
        card.innerHTML = `
            <img class="team-card-img" src="${member.img}" alt="${member.alt}" loading="lazy" onerror="this.src='https://picsum.photos/id/1/600/600'">
            <h4>${member.name}</h4>
            <div class="position">${member.position}</div>
            <div class="brief">${member.brief.length > 75 ? member.brief.substring(0, 75) + '…' : member.brief}</div>
        `;
        card.addEventListener('click', (e) => {
            e.stopPropagation();
            openModal(member.img, descForModal);
        });
        return card;
    }

    // 渲染顶部并排领导
    function renderTopLeaders() {
        const container = document.getElementById('topLeadersContainer');
        if (!container) return;
        container.innerHTML = '';
        topExecutives.forEach(exec => {
            const fullDesc = `${exec.name} · ${exec.position}：${exec.brief}`;
            const card = createTeamCard(exec, fullDesc);
            container.appendChild(card);
        });
    }

    // 渲染其他部门经理 + 工会主席
    function renderOtherLeaders() {
        const container = document.getElementById('otherLeadersContainer');
        if (!container) return;
        container.innerHTML = '';
        const gridWrapper = document.createElement('div');
        gridWrapper.className = 'executive-grid';
        otherManagers.forEach(manager => {
            const fullDesc = `${manager.name} · ${manager.position}：${manager.brief}`;
            const card = createTeamCard(manager, fullDesc);
            gridWrapper.appendChild(card);
        });
        container.appendChild(gridWrapper);
    }

    // 渲染部门合影: 包含管理团队+原部门+生产运行四班+新增电工班A/B，共14项，grid自动每行四个完美换行
    function renderDeptGallery() {
        const galleryContainer = document.getElementById('deptGallery');
        if (!galleryContainer) return;
        galleryContainer.innerHTML = '';
        deptPhotos.forEach(dept => {
            const deptDiv = document.createElement('div');
            deptDiv.className = 'dept-item';
            // 处理图片地址，如果有真实图片就用，否则用随机占位图，确保显示
            const imgSrc = dept.img && dept.img !== '' ? dept.img : dept.defaultPic;
            deptDiv.setAttribute('data-img', imgSrc);
            deptDiv.setAttribute('data-desc', dept.desc);
            deptDiv.innerHTML = `
                <img src="${imgSrc}" alt="${dept.name}" loading="lazy" onerror="this.src='${dept.defaultPic}'">
                <p>${dept.name}</p>
            `;
            deptDiv.addEventListener('click', (e) => {
                e.stopPropagation();
                openModal(imgSrc, dept.desc);
            });
            galleryContainer.appendChild(deptDiv);
        });
    }

    // 渲染员工风采画廊
    function renderStaffGallery() {
        const galleryContainer = document.getElementById('staffGallery');
        if (!galleryContainer) return;
        galleryContainer.innerHTML = '';
        staffImages.forEach(item => {
            const galItem = document.createElement('div');
            galItem.className = 'g-item';
            galItem.setAttribute('data-img', item.img);
            galItem.setAttribute('data-desc', item.desc);
            galItem.innerHTML = `<img src="${item.img}" alt="员工风采" loading="lazy" onerror="this.src='https://picsum.photos/id/1/600/400'">`;
            galItem.addEventListener('click', (e) => {
                e.stopPropagation();
                openModal(item.img, item.desc);
            });
            galleryContainer.appendChild(galItem);
        });
    }

    // ---------- 模态框逻辑 ----------
    const modal = document.getElementById('imgModal');
    const modalImg = document.getElementById('modalImg');
    const modalDesc = document.getElementById('modalDesc');
    const closeBtn = document.getElementById('closeBtn');

    function openModal(imgSrc, descText) {
        if (!modal || !modalImg) return;
        modalImg.src = imgSrc;
        modalImg.alt = descText || '团队风采照片';
        modalDesc.textContent = descText || '上海石化林德气体珍贵影像';
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        if (modal) {
            modal.style.display = 'none';
            document.body.style.overflow = '';
            setTimeout(() => {
                if (modalImg) modalImg.src = '';
            }, 200);
        }
    }

    if (closeBtn) {
        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeModal();
        });
    }
    if (modal) {
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });
    }
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal && modal.style.display === 'flex') {
            closeModal();
        }
    });

    // 页面加载完成后渲染所有板块
    window.addEventListener('DOMContentLoaded', () => {
        renderTopLeaders();     
        renderOtherLeaders();   
        renderDeptGallery();    // 渲染部门合影(包含管理团队+原有部门+生产运行甲乙丙丁+电工班A/电工班B)
        renderStaffGallery();
    });
</script>
</body>
</html>
